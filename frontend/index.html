<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · AdLedger</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="brand"><span class="logo" style="color:#fff">A</span>AdLedger</div>
      <p class="muted">Campaign-to-Revenue Intelligence for marketing agencies</p>
      <form id="loginForm">
        <label class="field"><span>Email</span><input name="email" type="email" required></label>
        <label class="field"><span>Password</span><input name="password" type="password" required></label>
        <button class="btn btn-primary" type="submit">Sign in</button>
      </form>
    </div>
  </div>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/pages/login.js"></script>
</body>
</html>
